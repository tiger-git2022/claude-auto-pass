<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>auto-pass-test</title></head>
<body>
  <!-- The permission prompt appears 25 s after load, i.e. after CI has minimized the window (Claude asking while minimized). -->
  <h1>Claude is working…</h1>
  <div id="slot"></div>
  <script>
    setTimeout(function () {
      document.getElementById('slot').innerHTML =
        '<div role="dialog" aria-label="Permission"><p>Run command: <code>ls</code></p><div>' +
        '<button onclick="document.title=\'CLICKED-DENY\'">Deny</button>' +
        '<button onclick="document.title=\'CLICKED-ONCE\'">Allow once</button>' +
        '<button onclick="document.title=\'CLICKED-SESSION\'">Allow for this chat</button></div></div>';
    }, 25000);
  </script>
</body>
</html>
