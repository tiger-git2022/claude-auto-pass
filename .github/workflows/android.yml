name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'windows/**', '.github/workflows/windows.yml', 'scripts/windows-ci.py']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'windows/**', '.github/workflows/windows.yml', 'scripts/windows-ci.py']
  workflow_dispatch:
    inputs:
      force:
        description: '重新发布同一提交 / Release this commit again'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute numbered version
        id: version
        env:
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          git fetch --force --tags origin
          python scripts/ci-version.py
      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.version.outputs.skip != 'true'
      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.skip != 'true'
      - name: Rule and update version checks
        if: steps.version.outputs.skip != 'true'
        run: |
          bash scripts/test-rules.sh
          python tests/ci_release_test.py
      - name: Build and lint
        if: steps.version.outputs.skip != 'true'
        run: bash gradlew assembleDebug lintDebug -Papp.buildNumber=${{ steps.version.outputs.build }} --console=plain
      - name: Prepare signing
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secret'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/app-signing.jks"
      - name: Build signed APK
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          APP_KEYSTORE_PATH: ${{ runner.temp }}/app-signing.jks
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          bash gradlew assembleRelease -Papp.buildNumber=${{ steps.version.outputs.build }} --console=plain
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/claude-auto-pass.apk
          # Fail the release if any signature scheme is missing (vivo rejects APKs without the v1 certificate).
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          # --min-sdk-version 23 makes apksigner check v1 and v2 too; for minSdk 28 it would only check v3.
          "$APKSIGNER" verify --verbose --print-certs --min-sdk-version 23 dist/claude-auto-pass.apk | tee apksigner.txt
          for scheme in 1 2 3; do grep -q "Verified using v$scheme scheme .*: true" apksigner.txt || { echo "Missing v$scheme signature"; exit 1; }; done
          cd dist && sha256sum claude-auto-pass.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: steps.version.outputs.skip != 'true'
        with:
          name: ClaudeAutoPass-${{ steps.version.outputs.tag }}
          path: |
            dist/*
            app/build/outputs/apk/debug/*.apk
      - name: Chinese-first release notes
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        run: python scripts/release-notes.py '${{ steps.version.outputs.base }}' '${{ steps.version.outputs.tag }}' '${{ steps.version.outputs.version_code }}'
      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Claude Auto Pass $TAG" --notes-file release-notes.md --latest
