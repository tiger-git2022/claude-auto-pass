name: Build Windows EXE
on:
  push:
    branches: [main]
    paths: ['windows/**', '!windows/**.md', '.github/workflows/windows.yml', 'scripts/windows-ci.py']
  pull_request:
    paths: ['windows/**', '!windows/**.md', '.github/workflows/windows.yml', 'scripts/windows-ci.py']
  workflow_dispatch:
    inputs:
      force:
        description: '重新发布同一提交 / Release this commit again'
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute numbered version
        id: version
        env:
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          git fetch --force --tags origin
          python scripts/windows-ci.py version
      - name: Rule tests
        if: steps.version.outputs.skip != 'true'
        run: dotnet run --project windows/tests/RulesTests.csproj -c Release
      - name: Build exe
        if: steps.version.outputs.skip != 'true'
        run: |
          dotnet build windows/ClaudeAutoPass.csproj -c Release -p:BuildNumber=${{ steps.version.outputs.build }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item windows/bin/Release/net48/ClaudeAutoPass.exe dist/claude-auto-pass.exe
          $hash = (Get-FileHash dist/claude-auto-pass.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path dist/SHA256SUMS.txt -Value "$hash  claude-auto-pass.exe" -Encoding ascii
          Get-ChildItem dist | Format-Table Name, Length
      - name: Self-test with WinForms buttons
        if: steps.version.outputs.skip != 'true'
        run: |
          $out = "$env:RUNNER_TEMP/selftest-form.txt"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-form', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" }
          if ($p.ExitCode -ne 0) { Write-Error "WinForms self-test failed ($($p.ExitCode))"; exit 1 }
      - name: Self-test checking for updates without the GitHub API
        if: steps.version.outputs.skip != 'true'
        run: |
          $out = "$env:RUNNER_TEMP/selftest-update.txt"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-update', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" }
          if ($p.ExitCode -ne 0) { Write-Error "Update self-test failed ($($p.ExitCode))"; exit 1 }
      - name: Self-test opening Claude from the taskbar
        if: steps.version.outputs.skip != 'true'
        run: |
          $out = "$env:RUNNER_TEMP/selftest-taskbar.txt"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-taskbar', $out -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" }
          if ($p.ExitCode -ne 0) { Write-Error "Taskbar self-test failed ($($p.ExitCode))"; exit 1 }
      - name: Self-test opening a hidden Electron window from the taskbar
        if: steps.version.outputs.skip != 'true'
        run: |
          # A stand-in for Claude Desktop (Electron, closes to the tray); the tray app must open its main window so that the
          # page inside knows it is visible again (a window shown from outside stays frozen).
          $dir = (Resolve-Path windows/tests/electron-tray).Path
          Push-Location $dir
          npm install --no-save --no-package-lock --no-audit --no-fund electron@37.2.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          $electron = "$dir\node_modules\electron\dist\electron.exe"
          function Run-Fake($name, $extra) {
            Get-Process electron -ErrorAction SilentlyContinue | Stop-Process -Force
            $res = "$env:RUNNER_TEMP\electron-$name.json"
            $out = "$env:RUNNER_TEMP\selftest-electron-$name.txt"
            $tool = Start-Process dist/claude-auto-pass.exe -ArgumentList (@('--self-test-taskbar-process', 'electron', '24', $out) + $extra) -PassThru
            Start-Sleep 2
            $app = Start-Process $electron -ArgumentList @("`"$dir`"", "--result=$res") -PassThru
            [void]$app.WaitForExit(40000)
            [void]$tool.WaitForExit(40000)
            Write-Host "== $name"
            if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
            if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" | ForEach-Object { Write-Host $_ } }
            if (-not (Test-Path $res)) { Write-Host "no result from the Electron app"; return $null }
            $r = Get-Content $res -Raw | ConvertFrom-Json
            $r.events | ForEach-Object { Write-Host "  app: $_" }
            Write-Host "mainVisible=$($r.mainVisible) page=$($r.page) trayClicks=$($r.trayClicks)"
            return $r
          }
          # Informational: the old way, showing the hidden window from outside.
          $old = Run-Fake 'outside' @('--no-tray-click')
          $new = Run-Fake 'tray' @()
          if (-not ($new -and $new.mainVisible -and $new.page -eq 'visible' -and $new.trayClicks -ge 1)) {
            Write-Error "The hidden Electron main window was not opened through its tray icon"; exit 1
          }
      - name: Self-test with Edge (Chromium, like Claude Desktop)
        if: steps.version.outputs.skip != 'true'
        run: |
          $edge = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
          Add-Type -Namespace Win -Name User -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd); [DllImport("user32.dll")] public static extern bool IsIconic(IntPtr h); [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr after, int x, int y, int cx, int cy, uint flags);'
          function Run-Edge($name, $extra, $file = 'prompt.html', $code = 0, $title = 'CLICKED-SESSION', $mode = 'none', $toolArgs = @()) {
            $page = [Uri]::new((Resolve-Path "windows/tests/$file").Path).AbsoluteUri
            Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 2
            $edgeArgs = @("--user-data-dir=$env:RUNNER_TEMP\edge-$name", '--no-first-run', '--no-default-browser-check', "--app=$page") + $extra
            Start-Process $edge -ArgumentList $edgeArgs
            Start-Sleep 10
            $cover = $null
            Get-Process msedge -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 } | ForEach-Object {
              $h = $_.MainWindowHandle
              # Claude Desktop minimized: checks the page is still read and pressed while the window is an icon.
              if ($mode -eq 'minimize') { [void][Win.User]::ShowWindow($h, 6) }
              Start-Sleep 2
              Write-Host "$mode $($_.MainWindowTitle): iconic=$([Win.User]::IsIconic($h))"
            }
            # Fully covered by another (maximized, topmost) window.
            if ($mode -eq 'cover') {
              $cover = Start-Process pwsh -PassThru -ArgumentList '-NoProfile', '-Command', 'Add-Type -AssemblyName System.Windows.Forms; $f = New-Object Windows.Forms.Form; $f.Text = "cover"; $f.TopMost = $true; $f.FormBorderStyle = "None"; $f.StartPosition = "Manual"; $f.Bounds = [Windows.Forms.Screen]::PrimaryScreen.Bounds; [Windows.Forms.Application]::Run($f)'
              Start-Sleep 4
            }
            $out = "$env:RUNNER_TEMP/selftest-edge-$name.txt"
            $p = Start-Process dist/claude-auto-pass.exe -ArgumentList (@('--self-test-process', 'msedge', '30', $out) + $toolArgs) -Wait -PassThru
            Start-Sleep 2
            if ($cover) { Stop-Process -Id $cover.Id -Force -ErrorAction SilentlyContinue }
            $titles = (Get-Process msedge -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ', '
            Write-Host "== Edge $name : exit=$($p.ExitCode) titles=[$titles]"
            if (Test-Path $out) { Get-Content $out | Select-Object -First 70 | ForEach-Object { Write-Host $_ } }
            if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" | ForEach-Object { Write-Host $_ } }
            return ($p.ExitCode -eq $code -and $titles -match $title)
          }
          # Informational: does Chromium build its accessibility tree for a UI Automation client on its own?
          $auto = Run-Edge 'default' @()
          Write-Host "Without --force-renderer-accessibility: $auto"
          # Required: with the switch the tray app's "restart Claude with accessibility" uses.
          $forced = Run-Edge 'forced' @('--force-renderer-accessibility')
          # Claude Desktop Code card: only Deny and "Always allow, save to local project settings" (exit code 3).
          $local = Run-Edge 'local' @('--force-renderer-accessibility') 'prompt-local.html' 3 'CLICKED-LOCAL'
          # Same prompt with the window minimized (owner report: approvals stopped while Claude was minimized).
          # Informational: minimized before any UI Automation client asked for the page, without the switch. Chromium then
          # exposes only the title bar (as on the owner's PC), which is what the tray app's warning balloon detects.
          $minimizedDefault = Run-Edge 'minimized-default' @() 'prompt.html' 0 'CLICKED-SESSION' 'minimize'
          Write-Host "Minimized without --force-renderer-accessibility: $minimizedDefault"
          # Required: minimized with the switch (what "restart Claude with accessibility" gives).
          $minimized = Run-Edge 'minimized' @('--force-renderer-accessibility') 'prompt.html' 0 'CLICKED-SESSION' 'minimize'
          # Prompts that appear while the window is minimized never reach UI Automation (Chromium stops updating the page,
          # whatever the switches).
          $late = Run-Edge 'late-minimized' @('--force-renderer-accessibility') 'prompt-late.html' 0 'CLICKED-SESSION' 'minimize'
          Write-Host "Prompt after minimizing (expected to fail): $late"
          # A window fully covered by another (a borderless topmost form over the whole screen) is frozen too by Chromium's
          # native occlusion tracking (informational, expected to fail)...
          $lateOcc = Run-Edge 'late-cover-occlusion' @('--force-renderer-accessibility') 'prompt-late.html' 0 'CLICKED-SESSION' 'cover'
          Write-Host "Covered, occlusion tracking on (expected to fail): $lateOcc"
          # An app that sets its own --disable-features replaces ours (Chromium keeps the last value; informational)...
          $override = Run-Edge 'late-cover-override' @('--force-renderer-accessibility', '--disable-features=CalculateNativeWinOcclusion', '--disable-features=HardwareMediaKeyHandling') 'prompt-late.html' 0 'CLICKED-SESSION' 'cover'
          Write-Host "Covered, feature list replaced afterwards (expected to fail): $override"
          # ...so required: with the switches "restart Claude with accessibility" uses (AppInfo.ClaudeSwitches), even with the
          # feature list replaced, a covered window keeps updating...
          $switches = @('--force-renderer-accessibility', '--disable-backgrounding-occluded-windows', '--disable-features=CalculateNativeWinOcclusion')
          $lateCover = Run-Edge 'late-cover' ($switches + '--disable-features=HardwareMediaKeyHandling') 'prompt-late.html' 0 'CLICKED-SESSION' 'cover'
          # ...and "把 Claude 藏到屏幕外" (instead of minimizing) keeps it updating, from a normal or a minimized window.
          $hidden = Run-Edge 'late-hidden' $switches 'prompt-late.html' 0 'CLICKED-SESSION' 'none' @('--hide')
          $hiddenMin = Run-Edge 'late-hidden-minimized' $switches 'prompt-late.html' 0 'CLICKED-SESSION' 'minimize' @('--hide')
          # Taskbar clicks on a hidden Claude: a click (Windows minimizes the active window) brings it back on-screen; minimized
          # with other windows (Win+M) it stays minimized but opens on-screen.
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $page = [Uri]::new((Resolve-Path 'windows/tests/prompt.html').Path).AbsoluteUri
          Start-Process $edge -ArgumentList (@("--user-data-dir=$env:RUNNER_TEMP\edge-hider", '--no-first-run', '--no-default-browser-check', "--app=$page") + $switches)
          Start-Sleep 10
          $out = "$env:RUNNER_TEMP/selftest-hider.txt"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-hider', 'msedge', $out -Wait -PassThru
          Write-Host "== hider : exit=$($p.ExitCode)"
          if (Test-Path $out) { Get-Content $out | ForEach-Object { Write-Host $_ } }
          if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" | ForEach-Object { Write-Host $_ } }
          $hider = ($p.ExitCode -eq 0)
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          # Steam Workshop adult-content gate: presses the clickable "查看物品" box, not the decoy or "取消".
          $page = [Uri]::new((Resolve-Path 'windows/tests/steam-gate.html').Path).AbsoluteUri
          Start-Process $edge -ArgumentList @("--user-data-dir=$env:RUNNER_TEMP\edge-steam", '--no-first-run', '--no-default-browser-check', '--force-renderer-accessibility', "--app=$page")
          Start-Sleep 10
          $out = "$env:RUNNER_TEMP/selftest-edge-steam.txt"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-steam', 'msedge', '30', $out -Wait -PassThru
          Start-Sleep 2
          $titles = (Get-Process msedge -ErrorAction SilentlyContinue | Where-Object MainWindowTitle | ForEach-Object MainWindowTitle) -join ', '
          Write-Host "== Edge steam : exit=$($p.ExitCode) titles=[$titles]"
          if (Test-Path $out) { Get-Content $out | Select-Object -First 70 | ForEach-Object { Write-Host $_ } }
          if (Test-Path "$out.crash.txt") { Get-Content "$out.crash.txt" | ForEach-Object { Write-Host $_ } }
          $steam = ($p.ExitCode -eq 0 -and $titles -match 'CLICKED-VIEW')
          Get-Process msedge -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $steam) { Write-Error 'Edge Steam gate self-test failed'; exit 1 }
          if (-not $forced) { Write-Error 'Edge self-test failed'; exit 1 }
          if (-not $local) { Write-Error 'Edge local-project self-test failed'; exit 1 }
          if (-not $minimized) { Write-Error 'Edge minimized self-test failed'; exit 1 }
          if (-not $lateCover) { Write-Error 'Edge covered-window self-test failed'; exit 1 }
          if (-not $hidden) { Write-Error 'Edge off-screen self-test failed'; exit 1 }
          if (-not $hiddenMin) { Write-Error 'Edge off-screen-from-minimized self-test failed'; exit 1 }
          if (-not $hider) { Write-Error 'Edge taskbar-click-on-hidden self-test failed'; exit 1 }
      - name: Self-test tray menu (screenshots)
        if: steps.version.outputs.skip != 'true'
        run: |
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $prefix = "$PWD/screenshots/menu"
          $p = Start-Process dist/claude-auto-pass.exe -ArgumentList '--self-test-menu', $prefix -Wait -PassThru
          if (Test-Path "$prefix.txt") { Get-Content "$prefix.txt" }
          if (Test-Path "$prefix.crash.txt") { Get-Content "$prefix.crash.txt" }
          if ($p.ExitCode -ne 0) { Write-Error "Tray menu self-test failed ($($p.ExitCode))"; exit 1 }
      - uses: actions/upload-artifact@v7
        if: always() && steps.version.outputs.skip != 'true'
        with:
          name: menu-screenshots-${{ steps.version.outputs.tag }}
          path: screenshots/*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always() && steps.version.outputs.skip != 'true'
        with:
          name: ClaudeAutoPass-Windows-${{ steps.version.outputs.tag }}
          path: dist/*
      - name: Chinese-first release notes
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        run: python scripts/windows-ci.py notes '${{ steps.version.outputs.base }}' '${{ steps.version.outputs.tag }}'
      - name: Publish GitHub release
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # --latest=false keeps the APK release as "latest", which the Android app checks for updates.
        run: gh release create $env:TAG dist/claude-auto-pass.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Claude Auto Pass Windows $env:TAG" --notes-file windows-release-notes.md --latest=false
